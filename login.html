<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cloud AI - Login</title>
        <style>
            /* ============================================
           RESET
        ============================================ */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            hr {
                border: none;
                margin: 0;
                padding: 0;
            }
            /* ============================================
           PAGE
        ============================================ */
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                transition: background-image 0.5s ease;
                overflow: hidden;
            }
            /* ============================================
           BACKGROUND OVERLAY
        ============================================ */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.35);
                backdrop-filter: blur(4px);
                z-index: -1;
            }
            /* ============================================
           LOGIN CARD
        ============================================ */
            .login-card {
                visibility: hidden;
                width: min(420px, 90%);
                padding: 45px 35px;
                text-align: center;
                border-radius: 24px;
                border-bottom: none !important;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.18);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
                color: white;
            }
            /* ============================================
           TITLE
        ============================================ */
            .login-card h1 {
                font-size: 32px;
                margin-bottom: 12px;
                font-weight: 700;
                letter-spacing: -0.5px;
            }
            /* ============================================
           DESCRIPTION
        ============================================ */
            .login-card p {
                font-size: 15px;
                color: rgba(255, 255, 255, 0.75);
                margin-bottom: 30px;
            }
            /* ============================================
           GOOGLE BUTTON
        ============================================ */
            #googleLoginButton {
                width: 100%;
                padding: 14px 20px;
                border: none;
                border-radius: 12px;
                background: white;
                color: #222;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
            }
            #googleLoginButton:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            }
            #googleLoginButton:active {
                transform: translateY(0);
            }
            /* ============================================
           GOOGLE ICON
        ============================================ */
            .google-icon {
                width: 18px;
                height: 18px;
                margin-right: 10px;
                vertical-align: middle;
            }
            /* ============================================
           LOADING TEXT
        ============================================ */
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                font-size: 16px;
            }
            /* ============================================
           MOBILE
        ============================================ */
            @media (max-width: 500px) {
                .login-card {
                    padding: 35px 25px;
                }
                .login-card h1 {
                    font-size: 26px;
                }
            }
        </style>
    </head>
    <body>
        <!-- Login Page Turtle Loader -->
<iframe
    id="loginLoaderFrame"
    src="/turtle-loader.html"
    title="Cloud-ai loading animation"
    style="
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 999999;
        background: #fafafa;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    "
></iframe>
        <!-- ============================================
         LOGIN CARD
    ============================================= -->
        <main class="login-card">
            <h1>Welcome to Cloud AI</h1>
            <p>Sign in with Google to continue</p>
            <button id="googleLoginButton">
                <img
                    class="google-icon"
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google"
                />
                Continue with Google
            </button>
        </main>
        <!-- ============================================
         LOGIN JAVASCRIPT
    ============================================= -->
       
<script>
    const loader = document.getElementById("loginLoaderFrame");
    const loginCard = document.querySelector(".login-card");
    const googleButton = document.getElementById("googleLoginButton");

    let loginStarted = false;

    function hideLoader() {
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
        loginCard.style.visibility = "visible";
    }

    function showLoader() {
        // Restart the same turtle animation for Google sign-in.
        loader.style.visibility = "visible";
        loader.style.opacity = "1";
        loader.src = "/turtle-loader.html";
    }

    function preloadImage(url) {
        return new Promise((resolve) => {
            const image = new Image();
            let finished = false;

            function finish(success) {
                if (finished) return;
                finished = true;
                resolve(success);
            }

            image.onload = () => finish(true);
            image.onerror = () => finish(false);

            // Fallback in case the image request hangs.
            setTimeout(() => finish(false), 8000);

            image.src = url;
        });
    }

    async function loadRandomTheme() {
        let backgroundUrl = "/assets/themes/purple.jpeg";

        try {
            const response = await fetch("/assets/themes/themes.json");

            if (!response.ok) {
                throw new Error("Could not load themes.json");
            }

            const themes = await response.json();

            if (!Array.isArray(themes) || themes.length === 0) {
                throw new Error("No themes available");
            }

            const selectedTheme =
                themes[Math.floor(Math.random() * themes.length)];

            backgroundUrl = selectedTheme.image;
        } catch (error) {
            console.error("Theme loading failed:", error);
        }

        const imageLoaded = await preloadImage(backgroundUrl);

        if (!imageLoaded && backgroundUrl !== "/assets/themes/purple.jpeg") {
            backgroundUrl = "/assets/themes/purple.jpeg";
            await preloadImage(backgroundUrl);
        }

        document.body.style.backgroundImage =
            `url("${backgroundUrl}")`;
    }

    googleButton.addEventListener("click", () => {
        if (loginStarted) return;

        loginStarted = true;
        googleButton.disabled = true;
        googleButton.style.cursor = "wait";
        googleButton.style.opacity = "0.7";

        showLoader();

        // Preserve the existing Express Google OAuth route.
        window.location.href = "/auth/google";
    });

    async function initializeLogin() {
        try {
            await loadRandomTheme();
        } catch (error) {
            console.error("Login initialization failed:", error);
        } finally {
            hideLoader();
        }
    }

    initializeLogin();
</script>

    </body>
</html>
